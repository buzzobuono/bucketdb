[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bucketdb"
dynamic = ["version"]
description = "PEP 249 SQL driver backed by DuckDB + S3 (Parquet)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "buzzobuono" },
]
keywords = ["s3", "duckdb", "parquet", "database", "sql", "pep249", "db-api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
]
dependencies = [
    "duckdb>=0.10",
    "boto3>=1.34",
    "pyarrow>=15",
]

[project.urls]
Homepage = "https://github.com/buzzobuono/bucketdb"
Repository = "https://github.com/buzzobuono/bucketdb"
Issues = "https://github.com/buzzobuono/bucketdb/issues"

[project.scripts]
bucketdb = "bucketdb.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "moto[s3,server]>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bucketdb*"]

[tool.setuptools_scm]
# version is derived from git tags (e.g. v1.0.0 → 1.0.0)
# between tags: 1.0.0.dev3+gabcdef
