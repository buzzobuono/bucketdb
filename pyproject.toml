[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "s3ql"
version = "0.1.0"
description = "PEP 249 SQL driver backed by DuckDB + S3 (Parquet)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.10",
    "boto3>=1.34",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "moto[s3]>=5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["s3ql*"]
